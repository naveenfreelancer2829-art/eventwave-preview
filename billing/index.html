<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Event Wave Billing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
:root{
  --bg:#EEF1F8; --surface:#FFFFFF; --surface-2:#F6F8FC; --ink:#101935; --muted:#5A6588;
  --line:#D5DBEA; --navy:#0E1E5B; --signal:#1F7BFF; --signal-ink:#FFFFFF; --ok:#13804B; --warn:#B4540A; --danger:#C0312B;
  --field:#FFFFFF; --shadow:0 1px 0 rgba(14,30,91,.06);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#080D22; --surface:#10183A; --surface-2:#0C1430; --ink:#E6EBFA; --muted:#97A2C6;
    --line:#26315C; --navy:#0B1648; --signal:#4A95FF; --signal-ink:#06102E; --ok:#4CC98A; --warn:#F0A35A; --danger:#FF7A72;
    --field:#0C1430; --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#080D22; --surface:#10183A; --surface-2:#0C1430; --ink:#E6EBFA; --muted:#97A2C6;
  --line:#26315C; --navy:#0B1648; --signal:#4A95FF; --signal-ink:#06102E; --ok:#4CC98A; --warn:#F0A35A; --danger:#FF7A72;
  --field:#0C1430; --shadow:none; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Barlow",system-ui,-apple-system,"Segoe UI",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--navy);color:#fff}
.top-in{max-width:1400px;margin:0 auto;display:flex;align-items:center;gap:18px;padding:10px 20px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{height:38px;width:auto}
.brand b{font:700 17px "Barlow Semi Condensed",sans-serif;letter-spacing:.01em;white-space:nowrap}
.brand small{display:block;font-size:12px;opacity:.7;font-weight:500}
nav{display:flex;gap:4px;margin-left:auto;overflow-x:auto}
nav button{background:none;border:0;color:#C9D5FF;padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;white-space:nowrap}
nav button[aria-current="page"]{background:rgba(255,255,255,.12);color:#fff}
.pulse{display:block;height:14px;width:100%;color:#3D8DFF}
.pulse path{stroke:currentColor}

main{max-width:1400px;margin:0 auto;padding:20px}
.view{display:none}.view.on{display:block}

/* Editor layout */
.editor{display:grid;grid-template-columns:minmax(0,520px) minmax(0,1fr);gap:22px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.sec{padding:16px 18px;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.sec h3{margin:0 0 12px;font:700 15px "Barlow Semi Condensed",sans-serif;color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
label{display:block;font-size:13px;color:var(--muted);font-weight:500}
label > input,label > select,label > textarea{margin-top:4px}
input,select,textarea{width:100%;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:38px}
textarea{resize:vertical;min-height:64px}
input[type=number]{text-align:right;font-variant-numeric:tabular-nums}
.full{grid-column:1/-1}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{white-space:nowrap;border:0;background:none;padding:7px 14px;border-radius:7px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
.row-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.row-head h3{margin:0}
.docno{white-space:nowrap;font:700 20px "Barlow Semi Condensed",sans-serif;font-variant-numeric:tabular-nums}

.items{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:1fr 54px 54px 86px 96px 30px;gap:6px;align-items:center}
.item-head{font-size:12px;color:var(--muted);font-weight:600}
.item-head span:nth-child(n+2){text-align:right}
.item input{padding:7px 8px;min-height:36px}
.item .amt[readonly]{background:var(--surface-2);color:var(--muted)}
.x{border:0;background:none;color:var(--muted);cursor:pointer;width:30px;height:36px;border-radius:6px;font-size:18px;line-height:1}
.x:hover{color:var(--danger);background:var(--surface-2)}
.charge{display:grid;grid-template-columns:1fr 120px 30px;gap:6px}
.link{border:0;background:none;color:var(--signal);font-weight:600;cursor:pointer;padding:6px 0}
.hint{font-size:12px;color:var(--muted);margin:6px 0 0}

.totals{display:grid;grid-template-columns:1fr auto;gap:4px 16px;font-variant-numeric:tabular-nums}
.totals .g{font:800 22px "Barlow Semi Condensed",sans-serif;border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.totals span:nth-child(even){text-align:right}

.actions{position:sticky;bottom:0;display:flex;flex-wrap:wrap;gap:8px;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);border-radius:0 0 12px 12px}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:9px;font-weight:600;cursor:pointer;min-height:40px}
.btn:hover{border-color:var(--signal)}
.btn.primary{background:var(--signal);border-color:var(--signal);color:var(--signal-ink)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}

.preview-wrap{position:static}
.preview-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;color:var(--muted);font-size:13px}
.stage{overflow:hidden;border-radius:6px}
.stage-in{transform-origin:top left;width:794px}

/* List views */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.toolbar input{max-width:320px}
.toolbar select{width:auto}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat span{font-size:13px;color:var(--muted)}
.stat b{display:block;font:700 24px "Barlow Semi Condensed",sans-serif;font-variant-numeric:tabular-nums;margin-top:2px}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table.list{width:100%;border-collapse:collapse;min-width:720px}
table.list th,table.list td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
table.list th{font-size:12px;color:var(--muted);font-weight:600;background:var(--surface-2)}
table.list td.n,table.list th.n{text-align:right;font-variant-numeric:tabular-nums}
table.list tr:last-child td{border-bottom:0}
table.list tbody tr{cursor:pointer}
table.list tbody tr:hover td{background:var(--surface-2)}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:20px;border:1px solid currentColor}
.tag.inv{color:var(--signal)}.tag.q{color:var(--muted)}
.tag.paid{color:var(--ok)}.tag.part{color:var(--warn)}.tag.due{color:var(--danger)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.settings{max-width:820px}
.note{font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(120px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:600;opacity:0;transition:.2s;pointer-events:none;z-index:20}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.mobile-switch{display:none}
.psearch{position:relative;margin-bottom:8px}
.psearch input{min-height:46px;font-size:16px;padding-left:12px;border-width:1.5px}
.presults{display:none;position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 28px rgba(0,0,0,.18);z-index:7;max-height:360px;overflow:auto;padding:4px}
.presults.on{display:block}
.pr{display:grid;grid-template-columns:1fr auto;gap:2px 10px;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:7px;cursor:pointer}
.pr:hover,.pr.act{background:var(--surface-2)}
.pr b{font-weight:600}.pr small{color:var(--muted);grid-column:1}.pr .pp{grid-row:1/3;grid-column:2;align-self:center;font-weight:600;font-variant-numeric:tabular-nums;color:var(--signal);white-space:nowrap}
.pr-empty{padding:12px;color:var(--muted)}
.cats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.cats .chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.gsw{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:12px;align-items:center;padding:12px 14px;margin:4px 0 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);cursor:pointer;color:var(--ink)}
.gsw input{position:absolute;opacity:0;width:1px;height:1px}
.gsw .sw{grid-row:1/3;width:46px;height:26px;border-radius:13px;background:var(--line);position:relative;transition:background .15s}
.gsw .sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.gsw input:checked+.sw{background:var(--ok)}
.gsw input:checked+.sw::after{transform:translateX(20px)}
.gsw input:focus-visible+.sw{outline:2px solid var(--signal);outline-offset:2px}
.gsw b{font-size:15px}.gsw small{color:var(--muted);font-size:13px}
.newp{margin:2px 0 14px;border:1px dashed var(--line);border-radius:12px;padding:10px 14px;background:var(--surface-2)}
.newp .grid2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.newp label{min-width:0}.newp .grid2{gap:10px 12px}.newp *{box-sizing:border-box}.newp input,.newp select{display:block;width:100%;max-width:100%;min-height:40px;font-size:15px;padding:7px 10px}
.newp summary{cursor:pointer;color:var(--signal);font-weight:600}
.newp[open]{border-style:solid}
.pr .mine{font-size:11px;font-weight:600;color:var(--ok);margin-left:6px}
.plist{display:flex;flex-direction:column;gap:6px}.plist div{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px}.plist div span{flex:1}
.ask{margin:0 0 8px;font-weight:600}
.big-choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big-choice button{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;cursor:pointer}
.big-choice button b{display:block;font:700 17px "Barlow Semi Condensed",sans-serif}
.big-choice button span{font-size:13px;color:var(--muted)}
.big-choice button[aria-pressed="true"]{border-color:var(--signal);background:color-mix(in srgb,var(--signal) 9%,var(--surface));box-shadow:inset 0 0 0 1px var(--signal)}
.step{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;font-size:13px;margin-right:8px;vertical-align:1px}
.sec h3{font-size:17px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--surface-2);border-radius:20px;padding:6px 12px;cursor:pointer;font-size:14px;font-weight:500;min-height:34px}
.chip:hover{border-color:var(--signal)}
.chip.add{color:var(--signal)}
.more{margin-top:10px}
.more summary{cursor:pointer;color:var(--signal);font-weight:600;padding:4px 0}
.check{display:flex;gap:8px;align-items:center;color:var(--ink);margin-top:10px}
.check input{width:20px;min-height:0;height:20px}
.item label{display:block;margin:0}.item label input{margin:0}
.item .m{display:none}
.actions .sum{margin-right:auto;display:flex;flex-direction:column;line-height:1.1}
.actions .sum span{font-size:12px;color:var(--muted)}
.actions .sum b{font:800 22px "Barlow Semi Condensed",sans-serif;font-variant-numeric:tabular-nums}
.menu{position:relative}
.menu summary{list-style:none;display:flex;align-items:center}
.menu summary::-webkit-details-marker{display:none}
.menu-list{position:absolute;right:0;bottom:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px;min-width:210px;box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:6}
.menu-list button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:7px;cursor:pointer;font-weight:500}
.menu-list button:hover{background:var(--surface-2)}
.menu-list .danger{color:var(--danger)}
.done{display:none;margin:0 0 14px;padding:14px 16px;border-radius:12px;background:color-mix(in srgb,var(--ok) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--ok) 45%,var(--line))}
.done.on{display:block}
.done b{display:block;font-size:16px;margin-bottom:8px}
.done .row{display:flex;flex-wrap:wrap;gap:8px}
.empty .btn{margin-top:12px}
input,select,textarea{font-size:16px}


/* ===== The bill sheet (always printed on white) ===== */
.sheet{width:794px;min-height:1123px;background:#fff;color:#0E1E5B;font:12px/1.35 "Barlow",Arial,sans-serif;display:flex;flex-direction:column;border:1px solid #0E1E5B}
.sheet *{color:inherit}
.s-head{background:#0E1E5B;color:#fff;display:flex;justify-content:space-between;align-items:flex-start;padding:22px 26px 14px}
.s-head img{height:86px;width:auto}
.s-co{text-align:right}
.s-co h1{margin:0 0 4px;font:700 30px "Barlow Semi Condensed",Arial,sans-serif;letter-spacing:.02em}
.s-co p{margin:0;font-size:12px;opacity:.92;white-space:pre-line}
.s-title{background:#0E1E5B;color:#fff;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 10px}
.s-title h2{margin:0;font:800 34px "Barlow Semi Condensed",Arial,sans-serif;letter-spacing:.02em;flex:1;text-align:center;padding-left:150px}
.s-title .gst{font-weight:700;font-style:italic;font-size:12px;white-space:nowrap}
.s-sub{text-align:center;font-weight:700;font-size:14px;padding:4px 0 0}
.s-meta{display:flex;justify-content:space-between;gap:20px;padding:10px 26px 14px}
.s-meta .to b{font-size:13px}
.s-meta .to p{margin:2px 0;white-space:pre-line}
.s-meta .nums{text-align:right;min-width:190px}
.s-meta .nums div{margin-bottom:3px}
.s-meta .nums span{display:block;font-weight:700}
.s-items{margin:0 26px;border-collapse:collapse;width:calc(100% - 52px)}
.s-items th{background:#0E1E5B;color:#fff;font-weight:600;padding:5px 8px;text-align:left}
.s-items th.r,.s-items td.r{text-align:right}
.s-items th.c,.s-items td.c{text-align:center}
.s-items td{padding:5px 8px;border-bottom:1px solid #1F4AA8;border-left:1px solid #1F4AA8;height:24px;font-variant-numeric:tabular-nums}
.s-items td:last-child{border-right:1px solid #1F4AA8}
.s-items tr.chg td{color:#0E1E5B;font-style:italic}
.s-low{display:flex;justify-content:flex-end;margin:0 26px}
.s-tot{width:322px;border-collapse:collapse;font-variant-numeric:tabular-nums}
.s-tot td{padding:3px 8px;border:1px solid #1F4AA8}
.s-tot td:last-child{text-align:right;font-weight:600}
.s-tot tr.g td{background:#0E1E5B;color:#fff;font-weight:700;font-size:13px}
.s-words{margin:8px 26px 0;border:1.5px solid #0E1E5B;padding:5px 8px;font-weight:700}
.s-foot{display:flex;gap:20px;margin:10px 26px 0;align-items:flex-end}
.s-bank{flex:1;background:#DCE6FB;padding:8px 10px}
.s-bank h4{margin:0 0 4px;text-align:center;font-size:13px}
.s-bank p{margin:1px 0}
.s-sign{width:190px;text-align:center}
.s-sign img{width:150px;height:auto;display:block;margin:0 auto}
.s-sign .line{border-top:1px solid #0E1E5B;margin-top:6px;padding-top:3px}
.s-terms{margin:10px 26px 0;font-size:11px}
.s-terms h4{margin:0 0 3px;font-size:12px}
.s-terms ol{margin:0;padding-left:18px}
.s-tag{text-align:center;font:700 16px "Barlow Semi Condensed",Arial,sans-serif;margin:auto 0 6px;padding-top:14px}
.s-band{background:#0E1E5B;color:#fff;text-align:center;font:700 22px "Barlow Semi Condensed",Arial,sans-serif;padding:4px}
.s-contact{display:flex;justify-content:space-around;font-weight:700;padding:7px 10px 10px}
.s-paid{margin:6px 26px 0;display:flex;justify-content:flex-end}
.s-paid table{width:322px;border-collapse:collapse}
.s-paid td{padding:3px 8px;border:1px solid #1F4AA8;font-variant-numeric:tabular-nums}
.s-paid td:last-child{text-align:right;font-weight:700}

@media (max-width:1100px){
  .editor{grid-template-columns:1fr}
  .preview-wrap{position:static}
  .mobile-switch{display:flex;margin-bottom:14px}
  .editor[data-show="edit"] .preview-col{display:none}
  .editor[data-show="preview"] .form-col{display:none}
}
@media (max-width:560px){
  main{padding:12px}
  .top-in{padding:8px 12px;flex-wrap:wrap;gap:8px}
  .brand small{display:none}
  nav button{padding:8px 10px}
  .docno{font-size:17px}
  nav{margin-left:0;width:100%}
  .grid2,.grid3{grid-template-columns:1fr}
  .item{grid-template-columns:1fr 1fr 1fr 36px;grid-template-areas:"d d d x" "days qty rate ." "amt amt amt .";background:var(--surface-2);border-radius:10px;padding:10px}
  .item-head{display:none}
  .item .m{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
  .item .d{grid-area:d}.item .days{grid-area:days}.item .qty{grid-area:qty}.item .rate{grid-area:rate}.item .amt-l{grid-area:amt}.item .x{grid-area:x;align-self:start}
  .big-choice{grid-template-columns:1fr}
  .actions{position:sticky;bottom:0;z-index:4}
  .actions .sum{width:100%;flex-direction:row;justify-content:space-between;align-items:baseline}
}
@media print{
  @page{size:A4;margin:0}
  body{background:#fff}
  body > *:not(#printRoot){display:none !important}
  body::before{display:none}
  #printRoot{display:block !important}
  #printRoot .sheet{border:0}
}
#printRoot{display:none}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>

  const b=["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
  const two=x=>x<20?a[x]:b[Math.floor(x/10)]+(x%10?" "+a[x%10]:"");
  const three=x=>(x>=100?a[Math.floor(x/100)]+" Hundred"+(x%100?" and ":""):"")+(x%100?two(x%100):"");
  let out=[];const cr=Math.floor(n/1e7);n%=1e7;const lk=Math.floor(n/1e5);n%=1e5;const th=Math.floor(n/1e3);n%=1e3;
  if(cr)out.push((cr>=100?three(cr):two(cr))+" Crore");if(lk)out.push(two(lk)+" Lakh");if(th)out.push(two(th)+" Thousand");if(n)out.push(three(n));
  return out.join(" ");
}

/* ---------- bills ---------- */
function nextSerial(type,date){
  const f=fy(date);const start=num(type==="invoice"?S.settings.invStart:S.settings.quoteStart)||1;
  const used=S.bills.filter(b=>b.type===type&&fy(b.date)===f&&(!S.cur||b.id!==S.cur.id)).map(b=>num(b.serial));
  return Math.max(start-1,...used,0)+1;
}
function docNo(b){return b.type==="invoice"?b.serial+"/"+fy(b.date):"EW-Q"+b.serial+"/"+fy(b.date)}
function blank(type){
  const b={id:uid(),type:type||"invoice",date:today(),eventDate:"",cust:{name:"",address:"",gstin:"",contact:"",phone:""},
    interstate:false,gstRate:num(S.settings.gstRate)||18,
    items:[{d:"",days:1,qty:1,rate:"",amt:""}],charges:[],discount:"",received:"",notes:"",saved:false};
  b.serial=nextSerial(b.type,b.date);return b;
}
function lineAmt(it){const r=num(it.rate);return r?num(it.qty||1)*num(it.days||1)*r:num(it.amt)}
function calc(b){
  const sub=b.items.reduce((s,it)=>s+lineAmt(it),0);
  const chg=b.charges.reduce((s,c)=>s+num(c.amt),0);
  const disc=num(b.discount);
  const taxable=Math.max(0,sub+chg-disc);
  const tax=taxable*num(b.gstRate)/100;
  const exact=taxable+tax, grand=Math.round(exact);
  const recv=num(b.received);
  return{sub,chg,disc,taxable,tax,half:tax/2,round:grand-exact,grand,recv,bal:Math.max(0,grand-recv)};
}
function payState(b){if(b.type!=="invoice")return"";const c=calc(b);if(c.recv>=c.grand&&c.grand>0)return"paid";if(c.recv>0)return"part";return"due"}

async function saveCur(){
  const b=S.cur;
  if(!b.cust.name.trim()){toast("Add the customer name first");$('[data-k="cust.name"]')?.focus();return false}
  if(!b.items.some(it=>it.d&&lineAmt(it))&&!b.items.some(it=>it.d)){toast("Add at least one item");return false}
  const clash=S.bills.find(x=>x.id!==b.id&&x.type===b.type&&fy(x.date)===fy(b.date)&&num(x.serial)===num(b.serial));
  if(clash&&!confirm(`${docNo(b)} is already used for ${clash.cust.name}. Save anyway?`))return false;
  delete b._lastGst;b.serial=num(b.serial);b.saved=true;b.total=calc(b).grand;b.updatedAt=Date.now();b.createdAt=b.createdAt||Date.now();
  try{
    await store.saveBill(JSON.parse(JSON.stringify(b)));
    const cid=slug(b.cust.name);const prev=S.customers.find(c=>c.id===cid);
    const cust={id:cid,name:b.cust.name.trim(),address:b.cust.address,gstin:b.cust.gstin,contact:b.cust.contact,phone:b.cust.phone,interstate:!!b.interstate};
    if(!prev||JSON.stringify({...prev})!==JSON.stringify({...prev,...cust}))await store.saveCustomer(cust);
    S.dirty=false;renderForm();setSaveState();showDone(b);return true;
  }catch(e){toast(e&&e.code==="quota_exceeded"?"Storage is full. Delete old bills to save new ones.":"Couldn't save. Check your connection and try again.");return false}
}

async function downloadPdf(){

  const holder=document.createElement("div");holder.style.cssText="position:fixed;left:-10000px;top:0";holder.innerHTML=sheetHtml(b);document.body.appendChild(holder);
  const el=holder.firstElementChild;el.style.border="0";
  try{
    await document.fonts?.ready;
    const blob=await html2pdf().set({margin:0,filename:fileName(b),image:{type:"jpeg",quality:0.96},html2canvas:{scale:2,useCORS:true,backgroundColor:"#ffffff"},jsPDF:{unit:"px",format:[794,1123],orientation:"portrait",hotfixes:["px_scaling"]}}).from(el).outputPdf("blob");
    let dl=null;try{dl=window.claude&&await window.claude.use("downloads")}catch(e){}
    if(dl){try{await dl.save({filename:fileName(b),data:blob});toast("PDF saved")}catch(e){if(e&&e.code!=="declined")toast("Couldn't save the PDF here. Use Print and pick Save as PDF.")}}
    else{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=fileName(b);document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)}
  }catch(e){toast("Couldn't make the PDF. Use Print and pick Save as PDF.")}

}

  if(t.id)return handleAct(t.id);
});
async function handleAct(id){
  switch(id){
    case"addItem":S.cur.items.push({d:"",days:S.cur.items.at(-1)?.days||1,qty:1,rate:"",amt:""});renderForm();$$(".item .d input").at(-1)?.focus();break;

    case"saveBill":await saveCur();break;

    case"printBill":printCur();break;

    case"dupBill":{const c=JSON.parse(JSON.stringify(S.cur));c.id=uid();c.saved=false;c.date=today();c.received="";delete c.createdAt;c.serial=nextSerial(c.type,c.date);S.cur=c;S.dirty=true;renderForm();renderSheet();setSaveState();toast("Copied into a new bill");break}

    case"delBill":if(confirm(`Delete ${docNo(S.cur)} for ${S.cur.cust.name}? This can't be undone.`)){await store.delBill(S.cur.id);toast("Bill deleted");S.cur=blank(S.cur.type);S.dirty=false;renderForm();renderSheet();setSaveState()}break;
    case"exportCsv":exportCsv();break;

    case"resetSettings":if(confirm("Put back the original Event Wave details?")){S.settings={...DEFAULT_SETTINGS};await store.saveSettings(S.settings);renderSettings();renderSheet();toast("Settings reset")}break;

function go(v){$$(".view").forEach(x=>x.classList.toggle("on",x.id==="v-"+v));$$("nav button").forEach(b=>b.dataset.nav===v?b.setAttribute("aria-current","page"):b.removeAttribute("aria-current"));if(v==="new")requestAnimationFrame(fitStage);if(v!=="new")renderLists();window.scrollTo(0,0)}
function renderLists(){
  const q=($("#q")?.value||"").toLowerCase(),ft=$("#fType")?.value,fs=$("#fStatus")?.value;
  const bills=[...S.bills].sort((a,b)=>(b.date||"").localeCompare(a.date||"")||num(b.serial)-num(a.serial));
  const list=bills.filter(b=>(!ft||b.type===ft)&&(!fs||payState(b)===fs)&&(!q||(b.cust.name+" "+docNo(b)).toLowerCase().includes(q)));
  const inv=S.bills.filter(b=>b.type==="invoice");const m=today().slice(0,7);
  const month=inv.filter(b=>(b.date||"").startsWith(m)).reduce((s,b)=>s+calc(b).grand,0);
  const due=inv.reduce((s,b)=>s+calc(b).bal,0);
  const fyNow=fy(today());const yr=inv.filter(b=>fy(b.date)===fyNow).reduce((s,b)=>s+calc(b).grand,0);
  const openQ=S.bills.filter(b=>b.type==="quote"&&!S.bills.some(x=>x.fromQuote===docNo(b))).length;
  $("#stats").innerHTML=`<div class="stat"><span>Billed this month</span><b>${inr(month)}</b></div><div class="stat"><span>Billed in FY ${fyNow}</span><b>${inr(yr)}</b></div><div class="stat"><span>Payments due</span><b>${inr(due)}</b></div><div class="stat"><span>Quotations not invoiced</span><b>${openQ}</b></div>`;
  $("#billsTbl").innerHTML=list.length?`<table class="list"><thead><tr><th>Number</th><th>Type</th><th>Date</th><th>Customer</th><th>Event</th><th class="n">Total</th><th class="n">Balance</th><th>Payment</th></tr></thead><tbody>${list.map(b=>{const c=calc(b),p=payState(b);return`<tr data-open="${esc(b.id)}" tabindex="0"><td><b>${esc(docNo(b))}</b></td><td><span class="tag ${b.type==="invoice"?"inv":"q"}">${b.type==="invoice"?"Invoice":"Quote"}</span></td><td>${esc(fmtDate(b.date))}</td><td>${esc(b.cust.name)}</td><td>${esc(b.eventDate)}</td><td class="n">${inr(c.grand)}</td><td class="n">${b.type==="invoice"?inr(c.bal):""}</td><td>${p?`<span class="tag ${p}">${{paid:"Paid",part:"Part paid",due:"Unpaid"}[p]}</span>`:""}</td></tr>`}).join("")}</tbody></table>`:`<div class="empty">${S.bills.length?"No bills match this search.":"No bills yet. Your saved quotations and invoices will be listed here.<br><button class=\"btn primary\" data-nav=\"new\">Make your first bill</button>"}</div>`;
  const cq=($("#cq")?.value||"").toLowerCase();
  const custs=S.customers.filter(c=>!cq||c.name.toLowerCase().includes(cq)).sort((a,b)=>a.name.localeCompare(b.name));
  $("#custTbl").innerHTML=custs.length?`<table class="list"><thead><tr><th>Customer</th><th>GSTIN</th><th>Phone</th><th class="n">Bills</th><th class="n">Invoiced</th><th class="n">Due</th></tr></thead><tbody>${custs.map(c=>{const bs=S.bills.filter(b=>slug(b.cust.name)===c.id);const iv=bs.filter(b=>b.type==="invoice");return`<tr data-cust="${esc(c.id)}" tabindex="0" title="Start a new invoice for ${esc(c.name)}"><td><b>${esc(c.name)}</b></td><td>${esc(c.gstin)}</td><td>${esc(c.phone)}</td><td class="n">${bs.length}</td><td class="n">${inr(iv.reduce((s,b)=>s+calc(b).grand,0))}</td><td class="n">${inr(iv.reduce((s,b)=>s+calc(b).bal,0))}</td></tr>`}).join("")}</tbody></table>`:`<div class="empty">Customers are saved automatically the first time you save a bill for them.</div>`;
}
["q","fType","fStatus","cq"].forEach(id=>document.getElementById(id).addEventListener("input",renderLists));
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.matches("tr[data-open],tr[data-cust]"))e.target.click()});
function exportCsv(){
  const rows=[["Number","Type","Date","Customer","GSTIN","Event date","Taxable","GST","Grand total","Received","Balance"]];
  [...S.bills].sort((a,b)=>(a.date||"").localeCompare(b.date||"")).forEach(b=>{const c=calc(b);rows.push([docNo(b),b.type==="invoice"?"Tax invoice":"Quotation",b.date,b.cust.name,b.cust.gstin,b.eventDate,c.taxable.toFixed(2),c.tax.toFixed(2),c.grand,c.recv,b.type==="invoice"?c.bal:""])});
  const csv=rows.map(r=>r.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(",")).join("\n");
  (async()=>{let dl=null;try{dl=window.claude&&await window.claude.use("downloads")}catch(e){}
    if(dl){try{await dl.save({filename:`EventWave_bills_${today()}.csv`,data:csv})}catch(e){}}
    else{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download=`EventWave_bills_${today()}.csv`;a.click()}})();
}

/* ---------- settings ---------- */
function renderSettings(){
  const s=S.settings;const f=(l,k,o={})=>{const v=s[k];if(o.type==="textarea")return`<label class="${o.cls||""}">${l}<textarea data-s="${k}" rows="${o.rows||3}">${esc(v)}</textarea></label>`;return`<label class="${o.cls||""}">${l}<input data-s="${k}" type="${o.type||"text"}" value="${esc(v)}"></label>`};
  $("#settingsForm").innerHTML=`
  <div class="sec"><h3>Business details</h3><div class="grid2">
    ${f("Business name","name")}${f("GSTIN","gstin")}
    ${f("Address","address",{type:"textarea",cls:"full"})}
    ${f("Home state","state")}${f("Phone","phone")}${f("Second phone","phone2")}${f("Email","email")}${f("Website","web")}${f("Footer line","tagline")}
  </div></div>
  <div class="sec"><h3>Bank details</h3><div class="grid2">
    ${f("Account name","accName")}${f("Bank","bankName")}${f("Account type","accType")}${f("Account number","accNo")}${f("IFSC","ifsc")}${f("Branch","branch")}
  </div></div>
  <div class="sec"><h3>Numbering and tax</h3><div class="grid3">
    ${f("First invoice no. this year","invStart",{type:"number"})}${f("First quotation no. this year","quoteStart",{type:"number"})}
    <label>Default GST<select data-s="gstRate">${[0,5,12,18,28].map(r=>`<option value="${r}" ${num(s.gstRate)===r?"selected":""}>${r}%</option>`).join("")}</select></label>
  </div><p class="note">New bills continue from the highest number already saved in the same financial year (April to March). Invoices look like 103/2026-27 and quotations like EW-Q50/2026-27.</p>
  <label style="display:flex;gap:8px;align-items:center;color:var(--ink);margin-top:10px"><input type="checkbox" data-s="showSig" ${s.showSig?"checked":""} style="width:auto;min-height:0"> Print the proprietor's signature stamp on bills</label></div>
  <div class="sec">${f("Quotation terms (one per line)","terms",{type:"textarea",rows:6})}</div>
  <div class="sec"><h3>Your saved products</h3>${(s.products||[]).length?`<div class="plist">${s.products.map(p=>`<div><span><b>${esc(p.n)}</b><br><small class="note">${esc(p.c)} · ${inr(p.lo)}${num(p.hi)>num(p.lo)?" – "+inr(p.hi).slice(1):""}/${esc(p.u||"day")}</small></span><button class="btn danger" data-delprod="${esc(p.n)}">Remove</button></div>`).join("")}</div>`:`<p class="note">None yet. Use “+ Add a new product” when making a bill.</p>`}</div>
  <div class="actions"><button class="btn primary" id="saveSettings">Save settings</button><button class="btn" id="resetSettings">Reset to original details</button>
  <span class="note" style="align-self:center;margin-left:auto">${store.mode==="db"?"Bills are stored online with this page, so anyone you share it with sees the same records.":"Bills are stored in this browser only."}</span></div>`;
}
async function saveSettingsFromForm(){
  const s={...S.settings};$$("[data-s]").forEach(el=>{const k=el.dataset.s;s[k]=el.type==="checkbox"?el.checked:(el.type==="number"?num(el.value):el.value)});
  s.gstRate=num(s.gstRate);S.settings=s;
  try{await store.saveSettings(s);toast("Settings saved")}catch(e){toast("Couldn't save settings. Try again.")}
  if(S.cur&&!S.cur.saved&&!S.dirty){S.cur.serial=nextSerial(S.cur.type,S.cur.date);S.cur.gstRate=s.gstRate}
  renderForm();renderSheet();
}

let tt=0;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),2600)}
window.addEventListener("beforeunload",e=>{if(S.dirty){e.preventDefault();e.returnValue=""}});

/* ---------- start ---------- */
loadLocal();S.cur=blank("invoice");renderForm();renderSettings();renderLists();renderSheet();setSaveState();
document.fonts&&document.fonts.ready.then(fitStage);
connectDb();
})();
</script>
</body>
</html>
